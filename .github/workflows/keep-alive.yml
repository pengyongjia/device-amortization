name: Keep demo site warm

# 目的：平台在 10 分钟无访问后会把沙箱休眠，首个访问者要承担唤醒 + 前端重新构建的等待。
# 这里用 GitHub Actions 定时访问，把唤醒成本转移给机器。
#
# 注意：GitHub Actions 的 schedule 最小间隔为 5 分钟，且高峰期实际触发可能延迟数分钟。
# 如果发现仍偶发冷启动，可改用 cron-job.org 这类准时服务（建议 5 分钟一次）。

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-alive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Ping demo site
        run: |
          URL="https://device-amortization.app.workbuddy.host/?sharecode=RNZFOPBYVK"
          for i in 1 2 3; do
            start=$(date +%s)
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 90 "$URL" || echo "000")
            elapsed=$(( $(date +%s) - start ))
            echo "attempt $i -> HTTP $code in ${elapsed}s"
            if [ "$code" = "200" ]; then
              exit 0
            fi
            sleep 10
          done
          echo "::warning::keep-alive failed after 3 attempts"
          exit 1
